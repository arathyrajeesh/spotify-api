{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SongFinder</title>
    <link rel="stylesheet" href="{% static 'music/css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <form class="auth-form" method="post">
            {% csrf_token %}
            <h2><i class="fas fa-music"></i> SongFinder</h2>
            <p style="text-align: center; margin-bottom: 24px; color: var(--spotify-light-gray);">Sign in to your account</p>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>

            <div class="auth-links">
                <p>Don't have an account? <a href="{% url 'register_page' %}">Sign up</a></p>
            </div>
        </form>
    </div>
</body>
</html>
