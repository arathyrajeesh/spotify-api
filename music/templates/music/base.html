{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SongFinder{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'music/css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-music"></i>
                <span>SongFinder</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="{% url 'search_page' %}" class="{% if request.resolver_match.url_name == 'search_page' %}active{% endif %}"><i class="fas fa-search"></i> Search</a></li>
                <li><a href="{% url 'favorites_page' %}" class="{% if request.resolver_match.url_name == 'favorites_page' %}active{% endif %}"><i class="fas fa-heart"></i> Favorites</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="{% url 'logout' %}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <h1>{% block page_title %}Welcome{% endblock %}</h1>
            </header>

            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="{% static 'music/js/app.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
